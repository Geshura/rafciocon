name: Steam Status Check

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  check-steam:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalacja zależności
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Odtworzenie sesji Steam
        env:
          STEAM_STORAGE_STATE_B64: ${{ secrets.STEAM_STORAGE_STATE_B64 }}
        run: |
          if [ -z "$STEAM_STORAGE_STATE_B64" ]; then
            echo "Brak sekretu STEAM_STORAGE_STATE_B64"
            exit 1
          fi
          printf '%s' "$STEAM_STORAGE_STATE_B64" | base64 --decode > steam-storage-state.json

      - name: Uruchomienie skryptu sprawdzającego
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python main.py