name: Steam Automation

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore Steam session
        env:
          STEAM_STORAGE_STATE_JSON: ${{ secrets.STEAM_STORAGE_STATE_JSON }}
        run: |
          if [ -z "$STEAM_STORAGE_STATE_JSON" ]; then
            echo "::error::Missing STEAM_STORAGE_STATE_JSON repository secret"
            exit 1
          fi
          printf '%s' "$STEAM_STORAGE_STATE_JSON" > steam-storage-state.json
          python -m json.tool steam-storage-state.json > /dev/null

      - name: Run Steam monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python main.py
