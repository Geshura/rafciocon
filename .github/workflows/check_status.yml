name: Steam Automation

on:
  push:
    branches: [ main ]

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check and Load Steam Storage State
        env:
          STEAM_STORAGE_STATE_B64: ${{ secrets.STEAM_STORAGE_STATE_B64 }}
        run: |
          if [ -z "$STEAM_STORAGE_STATE_B64" ]; then
            echo "Brak sekretu STEAM_STORAGE_STATE_B64. Upewnij się, że został dodany w ustawieniach repozytorium (Settings -> Secrets and variables -> Actions)."
            exit 1
          fi
          
          echo "Sekret znaleziony. Dekodowanie stanu sesji..."
          # Przykład dekodowania zmiennej base64 do pliku konfiguracyjnego/sesji
          echo "$STEAM_STORAGE_STATE_B64" | base64 --decode > steam_state.json
          echo "Stan Steam został pomyślnie zapisany do pliku."

      - name: Run main script
        env:
          STEAM_STORAGE_STATE_B64: ${{ secrets.STEAM_STORAGE_STATE_B64 }}
        run: |
          # Tutaj uruchamiasz swój główny skrypt (np. python lub node)
          python main.py